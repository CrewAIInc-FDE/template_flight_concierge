[project]
name = "template_flight_concierge"
version = "0.1.0"
description = "template_flight_concierge using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "arize-otel>=0.11.0",
    "crewai[tools]==1.15.21",
    "flight-concierge-tools>=0.1.0",
    "openinference-instrumentation-crewai>=1.1.0",
    "openinference-instrumentation-openai>=0.1.43",
]

[project.scripts]
kickoff = "template_flight_concierge.main:kickoff"
run_crew = "template_flight_concierge.main:kickoff"
plot = "template_flight_concierge.main:plot"
run_with_trigger = "template_flight_concierge.main:run_with_trigger"

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "crewai-demo-account-9b4c38c6"
url = "https://app.crewai.com/pypi/crewai-demo-account-9b4c38c6"

[tool.uv.sources]
flight-concierge-tools = { index = "crewai-demo-account-9b4c38c6" }


[tool.hatch.metadata]
allow-direct-references = true

[tool.crewai]
type = "flow"
project_id = "00ebc93e-2abd-4533-b64b-9ab4793e605a"
