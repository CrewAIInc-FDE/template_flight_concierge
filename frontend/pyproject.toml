[project]
name = "template_flight_concierge_ui"
version = "0.1.0"
description = "Flask web UI for the Flight Concierge agent (talks to the CrewAI AMP deployment over HTTP)"
requires-python = ">=3.10,<3.14"
dependencies = [
    "flask>=3.1",
    "gunicorn>=23.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32",
]

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["template_flight_concierge_ui"]
